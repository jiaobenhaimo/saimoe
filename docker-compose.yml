services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:80"          # host 3000 → container 80
    environment:
      API_ENABLED: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      BGM_USER_AGENT: bgm-saimoe/1.0
      DATA_DIR: /data       # local JSON store lives here
    volumes:
      - saimoe_data:/data   # persists across container restarts

volumes:
  saimoe_data:
