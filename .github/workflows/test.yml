name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (includes type checking)
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
      - name: Engine smoke test
        run: npm run test:smoke
      # Guards upgrades against an in-flight tournament's existing data file.
      - name: Legacy data compatibility test
        run: npm run test:compat
      # Encodes the operator's two voiding rules, which used to conflict.
      - name: Smart-void planner test
        run: npm run test:fraud-plan
      # Ordering matters: stop voting -> check -> settle, never settle-then-check.
      - name: Intermission scheduling test
        run: npm run test:break
      # 6-choose-2 groups and 1-of-2 knockout ballots: agreement must be scored by rarity.
      - name: Format-aware detection test
        run: npm run test:fraud-format
      # Tie-break by who reached the count first, character replacement, round archives.
      - name: Tie-break / replace / archive test
        run: npm run test:tiebreak
