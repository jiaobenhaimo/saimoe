name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (includes type checking)
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
      - name: Engine smoke test
        run: npm test
